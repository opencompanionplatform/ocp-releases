name: Assemble RC14 ARM64 release assets

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Reassemble and verify ARM64 binaries
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo='opencompanionplatform/ocp-releases'
          tag='v0.1.0-rc.14'
          mkdir -p parts out
          gh release download "$tag" -R "$repo" -p 'rc14-arm64-*.part*' -D parts
          for i in $(seq 0 8); do
            printf -v idx '%03d' "$i"
            test -s "parts/rc14-arm64-zip.part${idx}"
            test -s "parts/rc14-arm64-setup.part${idx}"
          done
          for kind in zip setup; do
            for i in $(seq 0 8); do
              printf -v idx '%03d' "$i"
              cat "parts/rc14-arm64-${kind}.part${idx}"
            done > "out/${kind}"
          done
          mv out/zip out/ocp-windows-arm64-0.1.0-rc.14.zip
          mv out/setup out/ocp-windows-arm64-0.1.0-rc.14-setup.exe
          test "$(stat -c '%s' out/ocp-windows-arm64-0.1.0-rc.14.zip)" = '273857925'
          test "$(stat -c '%s' out/ocp-windows-arm64-0.1.0-rc.14-setup.exe)" = '275014384'
          printf '%s  %s\n' 'e83a895bf4f52c7bbc6413d53b60acd5930ca32921cb272da9bd3c5838f0c353' 'out/ocp-windows-arm64-0.1.0-rc.14.zip' | sha256sum -c -
          printf '%s  %s\n' '86afee3cf57f17d9d3dbf50f3b20274ed04a95b18c785f6cffffff2aa505318b' 'out/ocp-windows-arm64-0.1.0-rc.14-setup.exe' | sha256sum -c -
          gh release upload "$tag" out/ocp-windows-arm64-0.1.0-rc.14.zip out/ocp-windows-arm64-0.1.0-rc.14-setup.exe -R "$repo"
          release_json="$(gh release view "$tag" -R "$repo" --json assets)"
          echo "$release_json" | jq -e '.assets | any(.name == "ocp-windows-arm64-0.1.0-rc.14.zip" and .digest == "sha256:e83a895bf4f52c7bbc6413d53b60acd5930ca32921cb272da9bd3c5838f0c353")'
          echo "$release_json" | jq -e '.assets | any(.name == "ocp-windows-arm64-0.1.0-rc.14-setup.exe" and .digest == "sha256:86afee3cf57f17d9d3dbf50f3b20274ed04a95b18c785f6cffffff2aa505318b")'
          echo 'RC14_ARM64_REMOTE_ASSEMBLY=PASS'
